<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AutoAttendance{% endblock %}</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_css %}{% endblock %}
</head>

<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <span class="logo-icon">📊</span>
                    <span class="logo-text">AutoAttendance</span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <a href="/" class="nav-item {% if request.endpoint == 'index' %}active{% endif %}">
                    <span class="nav-icon">🏠</span>
                    <span class="nav-label">Dashboard</span>
                </a>
                <a href="/register" class="nav-item {% if request.endpoint == 'register' %}active{% endif %}">
                    <span class="nav-icon">➕</span>
                    <span class="nav-label">Register Person</span>
                </a>
                <a href="/attendance" class="nav-item {% if request.endpoint == 'attendance' %}active{% endif %}">
                    <span class="nav-icon">📋</span>
                    <span class="nav-label">Attendance Records</span>
                </a>
                <a href="/settings" class="nav-item {% if request.endpoint == 'settings' %}active{% endif %}">
                    <span class="nav-icon">⚙️</span>
                    <span class="nav-label">Settings</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <div class="system-status">
                    <div class="status-indicator" id="statusIndicator"></div>
                    <div class="status-text">
                        <div class="status-label">System</div>
                        <div class="status-value" id="statusValue">Idle</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Bar -->
            <div class="top-bar">
                <div class="top-bar-left">
                    <h1>{% block page_title %}Dashboard{% endblock %}</h1>
                </div>
                <div class="top-bar-right">
                    <div class="search-box">
                        <input type="text" placeholder="Search..." class="search-input">
                    </div>
                    <div class="user-menu">
                        <button class="user-button">
                            <span class="user-avatar">👤</span>
                            <span class="user-label">Admin</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Page Content -->
            <div class="page-content">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <!-- Toast Notifications -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Modal -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <button class="modal-close">&times;</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/utils.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>

</html>
